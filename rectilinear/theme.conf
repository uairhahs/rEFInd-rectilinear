# Rectilinear — a minimal rEFInd theme
# Material You (expressive) tonal shapes with a glassmorphism feel.
# Enable with:  include themes/rectilinear/theme.conf  (end of refind.conf)

# Hide the hint line under the menu; everything else stays visible.
# Other values: banner label singleuser safemode hwtest arrows badges editor all
hideui hints

# Icons are looked up here first, then in rEFInd's default icon directory.
# Function icons and arrows are bold glyphs in scalloped tonal containers
# (violet = navigate, blue = system, magenta = actions); OS icons are the
# original set.
icons_dir themes/rectilinear/icons

# Background image (1920x1080 ideal). Its top-left pixel colour fills any
# area the image doesn't cover.
banner themes/rectilinear/background.png
banner_scale fillscreen

# Selection highlights: translucent tonal-violet glass with a gradient edge.
# Squircle for the OS row, circle for the tools row (PNG alpha required).
selection_big   themes/rectilinear/icons/selection_big.png
selection_small themes/rectilinear/icons/selection_small.png

# Space Mono Regular, 28px cells (see utils/make_font.sh to rebuild).
font themes/rectilinear/fonts/space-mono-28.png

# Tools shown on the second row, in order. Left to your refind.conf by
# default; uncomment to set it from the theme.
#showtools reboot, shutdown, firmware, about
